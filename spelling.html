<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词拼写 - 黑白背单词</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <div class="practice-header">
        <span class="mode-label">单词拼写</span>
        <span class="progress-indicator" id="spellingProgress">1 / 50</span>
    </div>

    <div class="question-card" style="padding: 40px 24px;">
        <!-- 释义 -->
        <div class="question-sub" style="margin-bottom: 20px; font-size: 1.1rem; color: #111;" id="spellingMeaning"></div>

        <!-- 拼写输入区域 -->
        <div class="spelling-hint" id="spellingHint">
            <!-- 动态生成 -->
        </div>

        <!-- 音标（单词下方） -->
        <div class="spelling-phonetic" id="spellingPhonetic"></div>

        <!-- 例句区域 -->
        <div class="example-block hidden" id="spellingExampleBlock" style="margin-top: 30px;">
            <div class="example-en" id="spellingExampleEn"></div>
            <div class="example-cn" id="spellingExampleCn"></div>
        </div>
    </div>

    <div class="action-bar">
        <div class="action-left">
            <a href="index.html" class="icon-btn" style="text-decoration: none;">← 返回</a>
            <button class="icon-btn" id="spellingAddWrongBtn">✚ 错题</button>
            <button class="icon-only-btn" id="spellingSpeakBtn" title="播放发音">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </button>
        </div>
        <div style="display:flex; gap:12px; flex:1; justify-content:flex-end;">
            <button class="btn btn-small" id="prevSpellingBtn" style="max-width: 140px;">← 上一题</button>
            <button class="btn btn-small" id="nextSpellingBtn" style="max-width: 140px;">下一题 →</button>
        </div>
    </div>

    <!-- 统计弹窗 -->
    <div id="resultModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-title">🎉 拼写完成</div>
            <div class="modal-stats-text" id="modalStatsText">答对 0 题 / 共 0 题</div>
            <div class="modal-rate-text" id="modalRateText">正确率 0%</div>
            <button class="btn" id="modalCloseBtn" style="background: #111; color: #fff;">关闭并返回首页</button>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
    let spellingQuestions = [];
    let currentSpellingIndex = 0;
    let correctCount = 0;
    // 记录每道题是否已经答对（用于统计与回看状态）
    let answeredCorrect = [];

    function startSpellingPractice() {
        let pool = ALL_VOCAB_WORDS ? [...ALL_VOCAB_WORDS] : [];

        if (pool.length === 0) {
            document.getElementById('spellingMeaning').textContent = "词库为空或加载失败";
            return;
        }

        shuffleArray(pool);
        let selected = pool.slice(0, 50);

        spellingQuestions = selected.map(wordObj => {
            const len = wordObj.word.length;
            let blankCount = 1;
            if (len > 4 && len <= 7) blankCount = 2;
            if (len > 7) blankCount = 3;

            let indices = [];
            while (indices.length < blankCount) {
                let r = Math.floor(Math.random() * len);
                if (!indices.includes(r)) indices.push(r);
            }
            return {
                ...wordObj,
                blankIndices: indices.sort((a, b) => a - b),
                // 记录用户已填字母，非空位为 null
                userInputs: new Array(len).fill(null)
            };
        });

        answeredCorrect = new Array(spellingQuestions.length).fill(false);
        currentSpellingIndex = 0;
        renderSpellingQuestion();
    }

    function renderSpellingQuestion() {
        const addWrongBtn = document.getElementById('spellingAddWrongBtn');

        if (currentSpellingIndex >= spellingQuestions.length) {
            showResultModal();
            return;
        }

        const q = spellingQuestions[currentSpellingIndex];
        document.getElementById('spellingProgress').textContent = `${currentSpellingIndex + 1} / ${spellingQuestions.length}`;
        document.getElementById('spellingMeaning').textContent = q.meaning;

        // 渲染音标（单词下方）
        const phoneticEl = document.getElementById('spellingPhonetic');
        const phonetic = typeof getPhonetic === 'function' ? getPhonetic(q.word) : '';
        if (phonetic) {
            phoneticEl.textContent = phonetic;
            phoneticEl.classList.remove('hidden');
        } else {
            phoneticEl.textContent = '';
            phoneticEl.classList.add('hidden');
        }

        const hintContainer = document.getElementById('spellingHint');
        hintContainer.innerHTML = '';

        const isAnsweredCorrect = answeredCorrect[currentSpellingIndex];
        const allFilled = q.blankIndices.every(i => q.userInputs[i]);

        for (let i = 0; i < q.word.length; i++) {
            if (q.blankIndices.includes(i)) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'spelling-input';
                input.dataset.index = i;

                input.setAttribute('autocomplete', 'off');
                input.setAttribute('autocorrect', 'off');
                input.setAttribute('autocapitalize', 'off');
                input.setAttribute('spellcheck', 'false');

                // 回填已填写的字母
                if (q.userInputs[i]) input.value = q.userInputs[i];

                // 回填红/绿状态：已答对则绿且只读；未答对但已填满则按对错标色
                if (isAnsweredCorrect) {
                    input.classList.add('correct');
                    input.readOnly = true;
                } else if (allFilled && q.userInputs[i]) {
                    const expected = q.word[i];
                    if (q.userInputs[i].toLowerCase() === expected) input.classList.add('correct');
                    else input.classList.add('wrong');
                }

                input.addEventListener('input', function () {
                    this.value = this.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
                    // 同步写入该题记录
                    q.userInputs[i] = this.value || null;

                    this.classList.remove('wrong', 'correct');
                    this.readOnly = false;
                    document.getElementById('spellingExampleBlock').classList.add('hidden');

                    const inputs = Array.from(document.querySelectorAll('.spelling-input'));
                    const currentIdx = inputs.indexOf(this);

                    if (this.value.length === 1 && currentIdx < inputs.length - 1) {
                        setTimeout(() => { inputs[currentIdx + 1].focus(); }, 10);
                    }
                    checkSpellingComplete();
                });

                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Backspace' && !this.value) {
                        const inputs = Array.from(document.querySelectorAll('.spelling-input'));
                        const currentIdx = inputs.indexOf(this);
                        if (currentIdx > 0) inputs[currentIdx - 1].focus();
                    }
                });

                hintContainer.appendChild(input);
            } else {
                const span = document.createElement('span');
                span.textContent = q.word[i];
                hintContainer.appendChild(span);
            }
        }

        // 已答对的题重新显示例句
        if (isAnsweredCorrect) {
            document.getElementById('spellingExampleEn').textContent = q.example;
            document.getElementById('spellingExampleCn').textContent = q.exampleMeaning;
            document.getElementById('spellingExampleBlock').classList.remove('hidden');
        } else {
            document.getElementById('spellingExampleBlock').classList.add('hidden');
        }

        if (wrongSet.has(q.id)) { addWrongBtn.classList.add('active'); addWrongBtn.innerHTML = '✓ 已加入'; }
        else { addWrongBtn.classList.remove('active'); addWrongBtn.innerHTML = '✚ 错题'; }

        // 自动播放单词发音
        speakWord(q.word);

        // 自动聚焦：优先第一个空位；都填了就聚焦最后一个
        setTimeout(() => {
            const inputs = Array.from(hintContainer.querySelectorAll('.spelling-input'));
            if (!inputs.length) return;
            const firstEmpty = inputs.find(inp => !inp.value);
            (firstEmpty || inputs[inputs.length - 1]).focus();
        }, 100);
    }

    // 填满最后一个字母后判断整题
    function checkSpellingComplete() {
        if (currentSpellingIndex >= spellingQuestions.length) return;
        const inputs = Array.from(document.querySelectorAll('.spelling-input'));
        // 全部空都已填满才判断
        if (inputs.some(inp => inp.value.trim().length === 0)) return;
        // 已全部只读（说明已答对并锁定）则跳过
        if (inputs.every(inp => inp.readOnly)) return;

        const q = spellingQuestions[currentSpellingIndex];
        let allCorrect = true;

        inputs.forEach(input => {
            const idx = parseInt(input.dataset.index);
            const expected = q.word[idx];
            const val = input.value.trim().toLowerCase();
            q.userInputs[idx] = val; // 同步记录

            if (val === expected) {
                input.classList.remove('wrong');
                input.classList.add('correct');
            } else {
                input.classList.remove('correct');
                input.classList.add('wrong');
                allCorrect = false;
            }
        });

        if (allCorrect) {
            // 答对：锁定全部输入框，显示例句，计入正确数
            inputs.forEach(inp => { inp.readOnly = true; });

            document.getElementById('spellingExampleEn').textContent = q.example;
            document.getElementById('spellingExampleCn').textContent = q.exampleMeaning;
            document.getElementById('spellingExampleBlock').classList.remove('hidden');

            if (!answeredCorrect[currentSpellingIndex]) {
                answeredCorrect[currentSpellingIndex] = true;
                correctCount++;
            }
            // 答对后不自动跳转，等待手动点击“下一题”
        } else {
            // 答错：保持可编辑，仅标红，不显示例句，等待用户修改或点击上一题/下一题
            inputs.forEach(inp => { inp.readOnly = false; });
        }
    }

    document.getElementById('spellingSpeakBtn').onclick = () => {
        if (currentSpellingIndex < spellingQuestions.length) speakWord(spellingQuestions[currentSpellingIndex].word);
    };

    document.getElementById('spellingAddWrongBtn').onclick = () => {
        if (currentSpellingIndex >= spellingQuestions.length) return;
        const q = spellingQuestions[currentSpellingIndex];
        const btn = document.getElementById('spellingAddWrongBtn');
        if (wrongSet.has(q.id)) {
            wrongSet.delete(q.id); btn.classList.remove('active'); btn.innerHTML = '✚ 错题';
        } else {
            wrongSet.add(q.id); btn.classList.add('active'); btn.innerHTML = '✓ 已加入';
        }
        saveWrongSet();
    };

    // 上一题：回看，保留用户已填内容与状态
    document.getElementById('prevSpellingBtn').onclick = () => {
        if (currentSpellingIndex <= 0) return;
        currentSpellingIndex--;
        renderSpellingQuestion();
    };

    // 下一题：可跳过当前题目
    document.getElementById('nextSpellingBtn').onclick = () => {
        if (currentSpellingIndex >= spellingQuestions.length - 1) {
            showResultModal();
            return;
        }
        currentSpellingIndex++;
        renderSpellingQuestion();
    };

    function showResultModal() {
        let total = spellingQuestions.length;
        if (total === 0) return;
        const rate = ((correctCount / total) * 100).toFixed(1);
        document.getElementById('modalStatsText').innerHTML = `答对 <span style="color:#10b981;font-weight:800">${correctCount}</span> 题 / 共 ${total} 题`;
        document.getElementById('modalRateText').textContent = `正确率 ${rate}%`;
        document.getElementById('resultModal').classList.remove('hidden');
    }

    document.getElementById('modalCloseBtn').onclick = () => {
        window.location.href = 'index.html';
    };

    startSpellingPractice();
</script>
</body>
</html>
